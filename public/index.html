<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Population Guesser</title>
<style>
  :root {
    --bg: #0f1220; --panel: #1a1e33; --panel-2: #232847; --accent: #5eead4; --accent-2: #f472b6;
    --text: #f4f4f8; --muted: #9ca3af; --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f1220, #1a1e33); color: var(--text);
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px;
  }
  .layout { display: flex; gap: 24px; width: 100%; max-width: 1200px; align-items: flex-start; flex-wrap: wrap; }
  .card { background: var(--panel); border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .main-card { flex: 3 1 480px; min-width: 340px; }
  .history-card { flex: 2 1 380px; min-width: 320px; }
  h1 { margin: 0 0 4px 0; font-size: 1.6rem; }
  .subtitle { color: var(--muted); margin: 0 0 20px 0; font-size: 0.95rem; }
  .country-name { font-size: 2.1rem; font-weight: 700; margin: 18px 0 6px 0; }
  .round-label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .timer-display { margin-top: 8px; font-size: 1.3rem; font-weight: 800; color: var(--accent); }
  .timer-display.low { color: var(--bad); }
  input[type="text"] {
    flex: 1; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--panel-2);
    background: #0d0f1c; color: var(--text); font-size: 1.1rem; min-width: 0;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button { font-family: inherit; }
  .btn {
    padding: 14px 22px; border-radius: 10px; border: none; background: var(--accent);
    color: #05261f; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--panel-2); color: var(--text); }
  .guess-row { display: flex; gap: 10px; margin-top: 14px; }
  .quick-multiply { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .quick-multiply-label { color: var(--muted); font-size: 0.8rem; }
  .btn-chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #2f355a; background: #171b30; color: var(--text); font-size: 0.8rem; cursor: pointer; }
  .btn-chip-clear { background: transparent; color: var(--muted); }
  .player-box { background: var(--panel-2); border-radius: 12px; padding: 14px; margin-top: 14px; border: 2px solid transparent; }
  .player-box.answered { border-color: var(--accent); opacity: 0.8; }
  .player-box-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .waiting-note { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .result { margin-top: 22px; padding: 18px; border-radius: 12px; background: var(--panel-2); display: none; }
  .result.show { display: block; }
  .result-player { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #2f355a; }
  .result-player:last-child { margin: 0; padding: 0; border: none; }
  .result-player-name { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
  .result-score { font-size: 1.8rem; font-weight: 800; }
  .result-detail { color: var(--muted); margin-top: 4px; font-size: 0.9rem; line-height: 1.5; }
  .result-detail b { color: var(--text); }
  .winner-tag { display: inline-block; margin-left: 8px; font-size: 0.7rem; background: var(--good); color: #05261f; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .stats-row { display: flex; gap: 16px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--panel-2); flex-wrap: wrap; }
  .stats-group { flex: 1; min-width: 140px; }
  .stats-group-name { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .stats-group-values { display: flex; gap: 14px; }
  .stat { flex: 1; text-align: center; }
  .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  .history-card h2 { margin: 0 0 14px 0; font-size: 1.1rem; }
  .chart-wrap { position: relative; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .chart-empty { color: var(--muted); font-size: 0.85rem; }
  .chart-row { margin-bottom: 14px; }
  .chart-row-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; gap: 8px; }
  .chart-row-label .name { font-weight: 600; }
  .chart-row-label .pct { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .chart-bar-track { position: relative; background: #0d0f1c; border-radius: 6px; height: 16px; margin-bottom: 4px; overflow: hidden; }
  .chart-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 6px; }
  .chart-axis { position: relative; height: 16px; margin: 0 0 10px 0; border-bottom: 1px solid var(--panel-2); }
  .chart-axis-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
  .country-chart { margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--panel-2); }
  .country-chart:last-child { border-bottom: none; }
  .country-chart-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; }
  .chart-actual-label { font-weight: 500; color: var(--muted); font-size: 0.78rem; }
  .country-chart-body { position: relative; }
  .chart-actual-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffffff; z-index: 2; pointer-events: none; }
  .history-list { margin-top: 18px; max-height: 220px; overflow-y: auto; }
  .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--panel-2); font-size: 0.88rem; gap: 8px; }
  .history-item .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .history-item .pts { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .empty-note { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
  .mode-select { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .mode-btn { flex: 1; min-width: 160px; padding: 18px; border-radius: 12px; border: 2px solid var(--panel-2); background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 1rem; font-weight: 700; }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn.active { border-color: var(--accent); background: var(--panel); }
  .name-row input { padding: 12px 14px; border-radius: 8px; border: 2px solid var(--panel-2); background: #0d0f1c; color: var(--text); font-size: 0.95rem; width: 100%; margin: 10px 0; }
  .note { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0 0; }
  .link-box { display: flex; gap: 8px; margin: 12px 0; }
  .link-box input { flex: 1; }
  .spinner-note { color: var(--accent); font-size: 0.9rem; margin-top: 14px; }
  .end-stats { display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap; }
  .end-player-card { flex: 1; min-width: 200px; background: var(--panel-2); border-radius: 12px; padding: 18px; }
  .end-player-card .big-score { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
  .winner-banner { margin-top: 18px; padding: 12px 16px; border-radius: 10px; background: rgba(74,222,128,0.15); color: var(--good); font-weight: 700; text-align: center; }
  #mapContainer svg { width: 100%; height: auto; border-radius: 10px; background: #0b1a2e; }
  .map-note { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
  .error-box { background: rgba(248,113,113,0.15); color: var(--bad); padding: 12px 16px; border-radius: 10px; margin: 14px 0; font-size: 0.9rem; }
  .leaderboard-section { margin-top: 26px; }
  .leaderboard-section h3 { margin: 0 0 10px 0; font-size: 1rem; }
  table.leaderboard { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.leaderboard th, table.leaderboard td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--panel-2); }
  table.leaderboard th { color: var(--muted); font-weight: 600; }
  .back-link { color: var(--muted); font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  @media (max-width: 720px) { .layout { flex-direction: column; } }
</style>
</head>
<body>

<div class="layout">
  <div class="card main-card">
    <h1>Population Guesser</h1>
    <p class="subtitle">Guess the population of the country shown. The closer you are, the more points you score.</p>

    <div id="app"></div>
  </div>

  <div class="card history-card" id="historyCard" style="display:none;">
    <h2>Guess History</h2>
    <div class="chart-wrap" id="historyChart"><div class="chart-empty">Guesses will show up here as you play.</div></div>
    <div class="history-list" id="historyList"><div class="empty-note">Guesses will show up here as you play.</div></div>
  </div>
</div>

const API = '/.netlify/functions/room';
const MAX_ROUNDS = 20;

const app = document.getElementById('app');
const historyCard = document.getElementById('historyCard');

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function parseGuess(raw) {
  if (!raw) return null;
  const cleaned = String(raw).replace(/[,\s]/g, '').replace(/[^0-9.]/g, '');
  if (!cleaned) return null;
  const val = parseFloat(cleaned);
  return isNaN(val) ? null : val;
}

// ---------------- Leaderboard / percentile (per-device, via localStorage) ----------------
// Each player's browser keeps its own history of finished games, same as the
// offline version. This isn't a global leaderboard across everyone who plays
// online — there's no account system — it's "how does this game compare to
// your past games on this device," which is what the offline version showed.
const LB_KEY = 'popGuesserOnlineHistory_v1';
let storageAvailable = false;
try {
  localStorage.setItem('__popgame_test__', '1');
  localStorage.removeItem('__popgame_test__');
  storageAvailable = true;
} catch (e) {
  storageAvailable = false;
}
let memoryHistory = [];

function loadHistory() {
  if (!storageAvailable) return memoryHistory.slice();
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch (e) { return []; }
}

function saveGameRecord(state, isSolo, myId, oppId) {
  const players = [];
  const me = state.players[myId];
  const meRounds = state.history.filter(h => h.playerId === myId).length;
  players.push({ name: me.name, totalScore: me.totalScore, avg: meRounds ? Math.round(me.totalScore / meRounds) : 0 });
  if (!isSolo) {
    const opp = state.players[oppId];
    const oppRounds = state.history.filter(h => h.playerId === oppId).length;
    players.push({ name: opp.name, totalScore: opp.totalScore, avg: oppRounds ? Math.round(opp.totalScore / oppRounds) : 0 });
  }
  const record = { date: new Date().toISOString(), mode: isSolo ? 'solo' : 'duo', rounds: state.round, players: players };
  let history = loadHistory();
  history.push(record);
  if (history.length > 200) history = history.slice(-200);
  if (storageAvailable) {
    try { localStorage.setItem(LB_KEY, JSON.stringify(history)); } catch (e) { storageAvailable = false; memoryHistory = history; }
  } else {
    memoryHistory = history;
  }
  return { record: record, history: history };
}

function renderPercentileHtml(myName, myScore, history) {
  const pastRecords = history.slice(0, -1);
  const pastScores = [];
  pastRecords.forEach(r => r.players.forEach(p => pastScores.push(p.totalScore)));
  let html = '';
  if (pastScores.length === 0) {
    html += '<p class="note">This is your first recorded game on this device — nothing to compare yet. Play more games and this will show how today\'s score stacks up!</p>';
  } else {
    const pct = Math.round(100 * pastScores.filter(s => s <= myScore).length / pastScores.length);
    html += '<p class="note"><b>' + myName + '</b>: ' + myScore + ' points — better than ' + pct + '% of ' + pastScores.length + ' past game scores recorded on this device.</p>';
  }
  if (!storageAvailable) {
    html += '<p class="note">Note: this browser isn\'t persisting saved games, so comparisons only cover games played since you last opened this page. Use "Export Game History" to keep a permanent copy.</p>';
  }
  return html;
}

function renderLeaderboardHtml(history) {
  const flat = [];
  history.forEach(r => r.players.forEach(p => flat.push({ date: r.date, mode: r.mode, name: p.name, score: p.totalScore })));
  flat.sort((a, b) => b.score - a.score);
  const top = flat.slice(0, 5);
  if (top.length === 0) return '';
  const rows = top.map(r => (
    '<tr><td>' + new Date(r.date).toLocaleDateString() + '</td><td>' + r.name + '</td><td>' + r.mode + '</td><td>' + r.score + '</td></tr>'
  )).join('');
  return '<table class="leaderboard"><thead><tr><th>Date</th><th>Player</th><th>Mode</th><th>Score</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function exportHistory() {
  try {
    const history = loadHistory();
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'population-game-history.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Sorry, this browser would not let the file download.');
  }
}

// ---------------- Router ----------------
let view = 'landing'; // landing, create-wait, join, playing
let landingMode = null; // null | 'solo' | 'duo' | 'local' — which mode is picked on the landing screen
let myPlayerId = null;
let myRoomId = null;
let pollTimer = null;
let lastRenderedRound = null;

// Same-screen pass-and-play state. Both players share one browser tab, so
// there's no real "me" — instead we track whose turn it is (derived from
// the server's answeredFlags) and a local gate that hides player 1's guess
// until player 2 has confirmed the device has been handed over.
let localMode = false;
let localNames = { p1: 'Player 1', p2: 'Player 2' };
let localPassGate = false;
let localLastRound = null;

const urlParams = new URLSearchParams(location.search);
const roomFromUrl = urlParams.get('room');

function render() {
  if (view === 'landing') return renderLanding();
  if (view === 'create-wait') return renderCreateWait();
  if (view === 'join') return renderJoin();
  if (view === 'error') return renderError();
  if (view === 'playing') return; // handled by renderGame() driven by polling
}

function renderLanding() {
  historyCard.style.display = 'none';
  let html = '<div class="mode-select">' +
      '<button class="mode-btn' + (landingMode === 'solo' ? ' active' : '') + '" id="btnModeSolo">1 Player</button>' +
      '<button class="mode-btn' + (landingMode === 'duo' ? ' active' : '') + '" id="btnModeDuo">2 Players (Online)</button>' +
      '<button class="mode-btn' + (landingMode === 'local' ? ' active' : '') + '" id="btnModeLocal">2 Players (Same Screen)</button>' +
    '</div>';

  if (landingMode === 'solo') {
    html += '<p class="note">Play on your own — guess the population of each country, no one else needed.</p>' +
      '<div class="name-row"><input type="text" id="createNameInput" placeholder="Your name" maxlength="24"></div>' +
      '<button class="btn" id="btnDoCreate">Start Game</button>';
  } else if (landingMode === 'duo') {
    html += '<p class="note">You\'ll get a link to send to a friend on any device. You both guess the same country each round, with a 30-second timer.</p>' +
      '<div class="name-row"><input type="text" id="createNameInput" placeholder="Your name" maxlength="24"></div>' +
      '<button class="btn" id="btnDoCreate">Create Game &amp; Get Link</button>';
  } else if (landingMode === 'local') {
    html += '<p class="note">Take turns on one device. Player 1 guesses first and their number is hidden as soon as they submit, so Player 2 can\'t see it before taking their turn.</p>' +
      '<div class="name-row"><input type="text" id="createNameInput1" placeholder="Player 1 name" maxlength="24"></div>' +
      '<div class="name-row"><input type="text" id="createNameInput2" placeholder="Player 2 name" maxlength="24"></div>' +
      '<button class="btn" id="btnDoCreateLocal">Start Game</button>';
  }

  app.innerHTML = html;
  document.getElementById('btnModeSolo').addEventListener('click', () => { landingMode = 'solo'; render(); });
  document.getElementById('btnModeDuo').addEventListener('click', () => { landingMode = 'duo'; render(); });
  document.getElementById('btnModeLocal').addEventListener('click', () => { landingMode = 'local'; render(); });
  if (landingMode === 'solo' || landingMode === 'duo') {
    document.getElementById('btnDoCreate').addEventListener('click', () => doCreate(landingMode));
  } else if (landingMode === 'local') {
    document.getElementById('btnDoCreateLocal').addEventListener('click', doCreateLocal);
  }
}

function renderJoin() {
  historyCard.style.display = 'none';
  app.innerHTML = (
    '<p class="note">You\'ve been invited to room <b>' + roomFromUrl + '</b>.</p>' +
    '<div class="name-row"><input type="text" id="joinNameInput" placeholder="Your name" maxlength="24"></div>' +
    '<button class="btn" id="btnDoJoin">Join Game</button>' +
    '<div id="joinError"></div>'
  );
  document.getElementById('btnDoJoin').addEventListener('click', doJoin);
}

function renderCreateWait() {
  historyCard.style.display = 'none';
  const link = location.origin + location.pathname + '?room=' + myRoomId;
  app.innerHTML = (
    '<p class="note">Send this link to whoever you\'re playing with:</p>' +
    '<div class="link-box"><input type="text" id="shareLink" readonly value="' + link + '"><button class="btn btn-secondary" id="copyLinkBtn">Copy</button></div>' +
    '<p class="spinner-note">Waiting for your friend to join…</p>' +
    '<p class="back-link" id="cancelWait">Cancel and start over</p>'
  );
  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    const input = document.getElementById('shareLink');
    input.select();
    navigator.clipboard && navigator.clipboard.writeText(input.value).catch(() => {});
    document.getElementById('copyLinkBtn').textContent = 'Copied!';
  });
  document.getElementById('cancelWait').addEventListener('click', () => {
    stopPolling();
    history.replaceState(null, '', location.pathname);
    landingMode = null;
    view = 'landing';
    render();
  });
}

function renderError() {
  historyCard.style.display = 'none';
  app.innerHTML = (
    '<div class="error-box">' + (window.__lastError || 'Something went wrong.') + '</div>' +
    '<button class="btn" id="backHomeBtn">Back to start</button>'
  );
  document.getElementById('backHomeBtn').addEventListener('click', () => {
    history.replaceState(null, '', location.pathname);
    landingMode = null;
    view = 'landing';
    render();
  });
}

function showError(msg) {
  window.__lastError = msg;
  view = 'error';
  render();
}

// ---------------- API helpers ----------------
async function api(action, payload) {
  const isGet = action === 'state';
  const opts = isGet
    ? { method: 'GET' }
    : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: action }, payload)) };
  const url = isGet
    ? API + '?action=state&roomId=' + encodeURIComponent(payload.roomId)
    : API;
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

// ---------------- Create / Join flow ----------------
async function doCreate(mode) {
  const name = document.getElementById('createNameInput').value.trim() || 'Player 1';
  try {
    const data = await api('create', { name: name, mode: mode });
    myPlayerId = data.playerId;
    myRoomId = data.roomId;
    if (mode === 'solo') {
      // No one else to wait for — the server already started round 1.
      view = 'playing';
      startPolling();
    } else {
      history.replaceState(null, '', location.pathname + '?room=' + myRoomId);
      view = 'create-wait';
      render();
      startPolling();
    }
  } catch (e) {
    showError(e.message);
  }
}

async function doCreateLocal() {
  const name1 = document.getElementById('createNameInput1').value.trim() || 'Player 1';
  const name2 = document.getElementById('createNameInput2').value.trim() || 'Player 2';
  try {
    const created = await api('create', { name: name1, mode: 'duo' });
    myRoomId = created.roomId;
    await api('join', { roomId: myRoomId, name: name2 });
    const started = await api('start', { roomId: myRoomId });
    localMode = true;
    localNames = { p1: name1, p2: name2 };
    localPassGate = false;
    localLastRound = null;
    myPlayerId = 'p1'; // arbitrary in local mode; turn is derived from answeredFlags, not this
    lastState = started.state;
    view = 'playing';
    renderGame(lastState);
    startPolling();
  } catch (e) {
    showError(e.message);
  }
}

async function doJoin() {
  const name = document.getElementById('joinNameInput').value.trim() || 'Player 2';
  try {
    const data = await api('join', { roomId: roomFromUrl, name: name });
    myPlayerId = data.playerId;
    myRoomId = data.roomId;
    view = 'playing';
    startPolling();
  } catch (e) {
    document.getElementById('joinError').innerHTML = '<div class="error-box">' + e.message + '</div>';
  }
}

function startPolling() {
  stopPolling();
  poll();
  pollTimer = setInterval(poll, 1200);
}
function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

let lastState = null;
async function poll() {
  try {
    const data = await api('state', { roomId: myRoomId });
    lastState = data.state;
    if (lastState.status === 'waiting') {
      // still waiting for player 2; stay on create-wait screen
      return;
    }
    if (view !== 'playing') {
      view = 'playing';
    }
    renderGame(lastState);
  } catch (e) {
    stopPolling();
    showError(e.message);
  }
}

// ---------------- Game rendering (online) ----------------
function renderGame(state) {
  // Polling rebuilds this whole panel every ~1.2s (to catch the timer ticking
  // and, in 2-player mode, the other player's status). Without this, anything
  // typed into the guess box gets wiped out mid-keystroke by the next poll.
  // Capture it here and restore it after the rebuild below.
  const prevInput = document.getElementById('guessInput');
  const preservedGuess = prevInput ? {
    value: prevInput.value,
    selectionStart: prevInput.selectionStart,
    selectionEnd: prevInput.selectionEnd,
    focused: document.activeElement === prevInput
  } : null;

  historyCard.style.display = 'block';
  const myId = myPlayerId;
  const isSolo = !state.players.p2;
  const oppId = isSolo ? null : (myId === 'p1' ? 'p2' : 'p1');
  const me = state.players[myId];
  const opp = isSolo ? null : state.players[oppId];

  if (state.status === 'ended') {
    stopPolling();
    return renderEnded(state);
  }

  if (state.status === 'ready') {
    return renderReady(state, myId, isSolo, oppId, me, opp);
  }

  if (localMode) {
    return renderGameLocal(state, preservedGuess);
  }

  const iAnswered = !!state.answeredFlags[myId];
  const oppAnswered = isSolo ? false : !!state.answeredFlags[oppId];

  let body = '';
  body += '<div class="round-label">Round ' + state.round + ' of ' + state.maxRounds + '</div>';
  body += '<div class="country-name">' + (state.current ? state.current.name : '…') + '</div>';

  if (state.status === 'in_progress') {
    const secsLeft = Math.max(0, Math.ceil((state.roundDeadline - Date.now()) / 1000));
    body += '<div class="timer-display' + (secsLeft <= 10 ? ' low' : '') + '">Time left: 0:' + (secsLeft < 10 ? '0' + secsLeft : secsLeft) + '</div>';

    body += '<div class="player-box' + (iAnswered ? ' answered' : '') + '">';
    body += '<div class="player-box-name"><span>' + me.name + (isSolo ? '' : ' (you)') + '</span><span>' + me.totalScore + ' pts</span></div>';
    if (iAnswered) {
      body += '<div class="waiting-note">' + (isSolo ? 'Moving to the next round…' : ('Answer submitted — waiting for ' + opp.name + '…')) + '</div>';
    } else {
      body += '<div class="guess-row"><input type="text" id="guessInput" placeholder="Type your guess, e.g. 5" inputmode="numeric" autocomplete="off"><button class="btn" id="submitGuessBtn">Guess</button></div>';
      body += '<div class="quick-multiply">' +
        '<span class="quick-multiply-label">Quick entry:</span>' +
        '<button class="btn-chip" data-mult="1000" type="button">&times; Thousand</button>' +
        '<button class="btn-chip" data-mult="1000000" type="button">&times; Million</button>' +
        '<button class="btn-chip" data-mult="1000000000" type="button">&times; Billion</button>' +
        '<button class="btn-chip btn-chip-clear" id="clearGuessBtn" type="button">Clear</button>' +
        '</div>';
    }
    body += '</div>';

    if (!isSolo) {
      body += '<div class="player-box' + (oppAnswered ? ' answered' : '') + '">';
      body += '<div class="player-box-name"><span>' + opp.name + '</span><span>' + opp.totalScore + ' pts</span></div>';
      body += '<div class="waiting-note">' + (oppAnswered ? 'Has answered this round.' : 'Still guessing…') + '</div>';
      body += '</div>';
    }
  } else if (state.status === 'revealing') {
    const roundEntries = state.history.filter(h => h.round === state.round);
    const secsLeft = Math.max(0, Math.ceil((state.revealUntil - Date.now()) / 1000));
    body += '<div class="result show">' + roundEntries.map(h => {
      const scoreColor = h.score >= 80 ? 'var(--good)' : (h.score >= 40 ? 'var(--accent)' : 'var(--bad)');
      const winner = roundEntries.length === 2 && roundEntries[0].score !== roundEntries[1].score && h.score === Math.max(roundEntries[0].score, roundEntries[1].score) ? '<span class="winner-tag">Round winner</span>' : '';
      const detail = h.timedOut ? 'Ran out of time — no answer submitted.' :
        ('Actual population: <b>' + fmt(h.actual) + '</b><br>Guess: <b>' + fmt(h.guess) + '</b><br>Off by <b>' + h.pct.toFixed(1) + '%</b>');
      return '<div class="result-player"><div class="result-player-name">' + h.playerName + (h.playerId === myId ? ' (you)' : '') + winner + '</div>' +
        '<div class="result-score" style="color:' + scoreColor + ';">' + h.score + ' points</div>' +
        '<div class="result-detail">' + detail + '</div></div>';
    }).join('') + '</div>';
    body += '<p class="note">Next round in ' + secsLeft + 's…</p>';
  }

  body += '<div class="stats-row">' +
    statGroup(me.name + (isSolo ? '' : ' (you)'), me, state.round) +
    (isSolo ? '' : statGroup(opp.name, opp, state.round)) +
    '</div>';

  body += '<div class="actions"><button class="btn btn-secondary" id="endGameBtn">End Game</button></div>';

  app.innerHTML = body;

  if (state.status === 'in_progress' && !iAnswered) {
    const newInput = document.getElementById('guessInput');
    if (preservedGuess) {
      newInput.value = preservedGuess.value;
      if (preservedGuess.focused) {
        newInput.focus();
        try { newInput.setSelectionRange(preservedGuess.selectionStart, preservedGuess.selectionEnd); } catch (e) {}
      }
    } else {
      newInput.focus();
    }
    document.getElementById('submitGuessBtn').addEventListener('click', submitOnlineGuess);
    document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitOnlineGuess(); });
    document.getElementById('clearGuessBtn').addEventListener('click', () => { document.getElementById('guessInput').value = ''; document.getElementById('guessInput').focus(); });
    document.querySelectorAll('.btn-chip[data-mult]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('guessInput');
        const current = parseGuess(input.value);
        const base = current === null ? 1 : current;
        input.value = fmt(base * Number(btn.dataset.mult));
        input.focus();
      });
    });
  }

  document.getElementById('endGameBtn').addEventListener('click', endGame);

  updateHistoryUI(state, myId);
}

function guessBoxHtml(playerName) {
  return '<div class="player-box">' +
    '<div class="player-box-name"><span>' + playerName + '\'s turn</span></div>' +
    '<div class="guess-row"><input type="text" id="guessInput" placeholder="Type your guess, e.g. 5" inputmode="numeric" autocomplete="off"><button class="btn" id="submitGuessBtn">Guess</button></div>' +
    '<div class="quick-multiply">' +
      '<span class="quick-multiply-label">Quick entry:</span>' +
      '<button class="btn-chip" data-mult="1000" type="button">&times; Thousand</button>' +
      '<button class="btn-chip" data-mult="1000000" type="button">&times; Million</button>' +
      '<button class="btn-chip" data-mult="1000000000" type="button">&times; Billion</button>' +
      '<button class="btn-chip btn-chip-clear" id="clearGuessBtn" type="button">Clear</button>' +
    '</div></div>';
}

// Same-screen pass-and-play rendering. There's no single "me" here — instead
// we look at which of p1/p2 has answered this round to decide whose turn it
// is, and gate the handoff between them with localPassGate so player 2 never
// sees player 1's guess box (or a lingering typed value) before they've had
// a chance to look away.
function renderGameLocal(state, preservedGuess) {
  historyCard.style.display = 'block';
  const p1 = state.players.p1, p2 = state.players.p2;
  const p1Answered = !!state.answeredFlags.p1;
  const p2Answered = !!state.answeredFlags.p2;

  if (state.status === 'in_progress' && state.round !== localLastRound) {
    localPassGate = false;
    localLastRound = state.round;
  }

  let body = '';
  body += '<div class="round-label">Round ' + state.round + ' of ' + state.maxRounds + '</div>';
  body += '<div class="country-name">' + (state.current ? state.current.name : '…') + '</div>';

  let showingInput = false;
  if (state.status === 'in_progress') {
    const secsLeft = Math.max(0, Math.ceil((state.roundDeadline - Date.now()) / 1000));
    body += '<div class="timer-display' + (secsLeft <= 10 ? ' low' : '') + '">Time left: 0:' + (secsLeft < 10 ? '0' + secsLeft : secsLeft) + '</div>';

    if (!p1Answered) {
      body += guessBoxHtml(localNames.p1);
      showingInput = true;
    } else if (!p2Answered && localPassGate) {
      body += '<div class="player-box"><div class="player-box-name"><span>Pass the device</span></div>' +
        '<p class="waiting-note">' + localNames.p1 + '\'s guess is locked in and hidden. Hand the device to ' + localNames.p2 + '.</p>' +
        '<button class="btn" id="passReadyBtn" type="button">' + localNames.p2 + ', I\'m ready</button></div>';
    } else if (!p2Answered) {
      body += guessBoxHtml(localNames.p2);
      showingInput = true;
    } else {
      body += '<p class="note">Both answers are in — resolving round…</p>';
    }
  } else if (state.status === 'revealing') {
    const roundEntries = state.history.filter(h => h.round === state.round);
    const secsLeft = Math.max(0, Math.ceil((state.revealUntil - Date.now()) / 1000));
    body += '<div class="result show">' + roundEntries.map(h => {
      const scoreColor = h.score >= 80 ? 'var(--good)' : (h.score >= 40 ? 'var(--accent)' : 'var(--bad)');
      const winner = roundEntries.length === 2 && roundEntries[0].score !== roundEntries[1].score && h.score === Math.max(roundEntries[0].score, roundEntries[1].score) ? '<span class="winner-tag">Round winner</span>' : '';
      const detail = h.timedOut ? 'Ran out of time — no answer submitted.' :
        ('Actual population: <b>' + fmt(h.actual) + '</b><br>Guess: <b>' + fmt(h.guess) + '</b><br>Off by <b>' + h.pct.toFixed(1) + '%</b>');
      return '<div class="result-player"><div class="result-player-name">' + h.playerName + winner + '</div>' +
        '<div class="result-score" style="color:' + scoreColor + ';">' + h.score + ' points</div>' +
        '<div class="result-detail">' + detail + '</div></div>';
    }).join('') + '</div>';
    body += '<p class="note">Next round in ' + secsLeft + 's…</p>';
  }

  body += '<div class="stats-row">' + statGroup(p1.name, p1, state.round) + statGroup(p2.name, p2, state.round) + '</div>';
  body += '<div class="actions"><button class="btn btn-secondary" id="endGameBtn">End Game</button></div>';

  app.innerHTML = body;

  if (showingInput) {
    const newInput = document.getElementById('guessInput');
    if (preservedGuess) {
      newInput.value = preservedGuess.value;
      if (preservedGuess.focused) {
        newInput.focus();
        try { newInput.setSelectionRange(preservedGuess.selectionStart, preservedGuess.selectionEnd); } catch (e) {}
      }
    } else {
      newInput.focus();
    }
    document.getElementById('submitGuessBtn').addEventListener('click', submitLocalGuess);
    newInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitLocalGuess(); });
    document.getElementById('clearGuessBtn').addEventListener('click', () => { newInput.value = ''; newInput.focus(); });
    document.querySelectorAll('.btn-chip[data-mult]').forEach(btn => {
      btn.addEventListener('click', () => {
        const current = parseGuess(newInput.value);
        const base = current === null ? 1 : current;
        newInput.value = fmt(base * Number(btn.dataset.mult));
        newInput.focus();
      });
    });
  }

  const passBtn = document.getElementById('passReadyBtn');
  if (passBtn) {
    passBtn.addEventListener('click', () => {
      localPassGate = false;
      renderGame(lastState);
    });
  }

  document.getElementById('endGameBtn').addEventListener('click', endGame);

  updateHistoryUI(state, null);
}

async function submitLocalGuess() {
  if (submittingGuess) return;
  const input = document.getElementById('guessInput');
  const guess = parseGuess(input.value);
  if (guess === null) { input.focus(); return; }
  const pid = !lastState.answeredFlags.p1 ? 'p1' : 'p2';
  submittingGuess = true;
  try {
    const data = await api('guess', { roomId: myRoomId, playerId: pid, guess: guess });
    lastState = data.state;
    if (pid === 'p1' && !data.state.answeredFlags.p2) {
      // Player 1 just went and player 2 hasn't answered yet — hide the
      // input behind the pass-device gate before rendering.
      localPassGate = true;
    }
    renderGame(lastState);
  } catch (e) {
    showError(e.message);
  } finally {
    submittingGuess = false;
  }
}

function renderReady(state, myId, isSolo, oppId, me, opp) {
  historyCard.style.display = 'none';
  let html = '<div class="round-label">Both players are in</div>' +
    '<div class="country-name" style="font-size:1.6rem;">Ready to play?</div>' +
    '<p class="note">' + me.name + ' (you) and ' + opp.name + ' have both joined. Either of you can start round 1 — 10 countries, 30 seconds each.</p>' +
    '<button class="btn" id="startGameBtn">Start Game</button>';
  app.innerHTML = html;
  document.getElementById('startGameBtn').addEventListener('click', async () => {
    const btn = document.getElementById('startGameBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
      const data = await api('start', { roomId: myRoomId });
      lastState = data.state;
      renderGame(lastState);
    } catch (e) {
      showError(e.message);
    }
  });
}

async function endGame() {
  try {
    const data = await api('end', { roomId: myRoomId });
    lastState = data.state;
    renderGame(lastState);
  } catch (e) {
    showError(e.message);
  }
}

function statGroup(name, player, roundsPlayed) {
  const rounds = Math.max(0, roundsPlayed - (lastState && lastState.status === 'in_progress' ? 1 : 0));
  const avg = rounds ? Math.round(player.totalScore / rounds) : 0;
  return '<div class="stats-group"><div class="stats-group-name">' + name + '</div>' +
    '<div class="stats-group-values">' +
      '<div class="stat"><div class="stat-value">' + rounds + '</div><div class="stat-label">Rounds</div></div>' +
      '<div class="stat"><div class="stat-value">' + player.totalScore + '</div><div class="stat-label">Total</div></div>' +
      '<div class="stat"><div class="stat-value">' + avg + '</div><div class="stat-label">Avg</div></div>' +
    '</div></div>';
}

let submittingGuess = false;
async function submitOnlineGuess() {
  if (submittingGuess) return;
  const input = document.getElementById('guessInput');
  const guess = parseGuess(input.value);
  if (guess === null) { input.focus(); return; }
  submittingGuess = true;
  try {
    const data = await api('guess', { roomId: myRoomId, playerId: myPlayerId, guess: guess });
    lastState = data.state;
    renderGame(lastState);
  } catch (e) {
    showError(e.message);
  } finally {
    submittingGuess = false;
  }
}

function updateHistoryUI(state, myId) {
  const listEl = document.getElementById('historyList');
  const entries = state.history.slice().reverse();
  const colorFor = pid => pid === 'p1' ? '#5eead4' : '#f472b6';
  if (entries.length === 0) {
    listEl.innerHTML = '<div class="empty-note">Guesses will show up here as you play.</div>';
  } else {
    listEl.innerHTML = entries.map(h => (
      '<div class="history-item"><span><span class="swatch" style="background:' + colorFor(h.playerId) + '"></span>' +
        h.playerName + (h.playerId === myId ? ' (you)' : '') + ' — ' + h.name + '</span>' +
        '<span class="pts">' + h.score + ' pts</span></div>'
    )).join('');
  }
  updateChart(state, myId, colorFor);
}

const CHART_LOG_MAX = Math.log10(1500000000);
function logPct(value) {
  const v = Math.max(1, value || 1);
  return Math.min(100, Math.max(0, (Math.log10(v) / CHART_LOG_MAX) * 100));
}
function fmtShort(n) {
  if (n >= 1e9) return (n / 1e9) + 'B';
  if (n >= 1e6) return (n / 1e6) + 'M';
  if (n >= 1e3) return (n / 1e3) + 'K';
  return String(n);
}
const CHART_AXIS_TICKS = [1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9];

// One mini bar-chart per country: a horizontal bar per player showing their
// guess (with % off in parentheses), plus a white line marking the actual
// population. Every chart shares the same log-scale x-axis so they can be
// compared directly, with a ruler of tick labels shown once at the top.
function updateChart(state, myId, colorFor) {
  const el = document.getElementById('historyChart');
  if (state.history.length === 0) {
    el.innerHTML = '<div class="chart-empty">Guesses will show up here as you play.</div>';
    return;
  }

  const byRound = {};
  state.history.forEach(h => {
    if (!byRound[h.round]) byRound[h.round] = [];
    byRound[h.round].push(h);
  });
  const rounds = Object.keys(byRound).map(Number).sort((a, b) => b - a);

  let html = '<div class="chart-axis">' + CHART_AXIS_TICKS.map(t =>
    '<span class="chart-axis-tick" style="left:' + logPct(t).toFixed(1) + '%;">' + fmtShort(t) + '</span>'
  ).join('') + '</div>';

  rounds.forEach(r => {
    const group = byRound[r];
    const actual = group[0].actual;
    const actualPct = logPct(actual);
    html += '<div class="country-chart">' +
      '<div class="country-chart-title">' + group[0].name + ' <span class="chart-actual-label">actual: ' + fmt(actual) + '</span></div>' +
      '<div class="country-chart-body">' +
      '<div class="chart-actual-line" style="left:' + actualPct.toFixed(1) + '%;"></div>' +
      group.map(h => {
        const guessPct = h.guess === null ? 0 : logPct(h.guess);
        const label = h.playerName + (h.playerId === myId ? ' (you)' : '');
        const detail = h.timedOut ? 'no answer' : (fmt(h.guess) + ' (' + h.pct.toFixed(1) + '% off)');
        return '<div class="chart-row"><div class="chart-row-label"><span class="name">' + label + '</span><span class="pct">' + detail + '</span></div>' +
          '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + guessPct + '%; background:' + colorFor(h.playerId) + '; opacity:0.9;"></div></div></div>';
      }).join('') +
      '</div></div>';
  });

  el.innerHTML = html;
}

// ---------------- End screen ----------------
function renderEnded(state) {
  const myId = myPlayerId;
  const isSolo = !state.players.p2;
  const oppId = isSolo ? null : (myId === 'p1' ? 'p2' : 'p1');
  const me = state.players[myId];
  const opp = isSolo ? null : state.players[oppId];

  const youSuffix = (isSolo || localMode) ? '' : ' (you)';

  let banner = '';
  if (isSolo) {
    banner = '<div class="winner-banner">Nice work — game complete!</div>';
  } else if (me.totalScore === opp.totalScore) {
    banner = '<div class="winner-banner">It\'s a tie!</div>';
  } else {
    banner = '<div class="winner-banner">' + (me.totalScore > opp.totalScore ? me.name + youSuffix : opp.name) + ' wins!</div>';
  }

  let html = '<div class="round-label">Game Over</div><div class="country-name" style="font-size:1.6rem;">Here\'s how it went</div>';
  html += banner;
  html += '<div class="end-stats">' +
    endCard(me.name + youSuffix, me, state.round) +
    (isSolo ? '' : endCard(opp.name, opp, state.round)) +
    '</div>';
  html += '<div style="margin-top:26px;"><h3>Guesses on the map</h3><div id="mapContainer"></div>' +
    '<p class="note" id="mapInfo">Click a dot to see the country and its actual population.</p>' +
    '<p class="map-note">Dots are placed by each country\'s approximate center. Map outline: <a href="https://github.com/flekschas/simple-world-map" target="_blank" rel="noopener" style="color:var(--accent);">Simple World Map</a> (CC BY-SA 3.0).</p></div>';

  const saved = saveGameRecord(state, isSolo, myId, oppId);
  html += '<div class="leaderboard-section">' +
    '<h3>How this game compares</h3>' +
    renderPercentileHtml(me.name, me.totalScore, saved.history) +
    renderLeaderboardHtml(saved.history) +
    '<div class="actions" style="margin-top:14px;"><button class="btn btn-secondary" id="exportHistoryBtn" type="button">Export Game History</button></div>' +
    '<p class="map-note">Your game history is saved in this browser only — it won\'t follow you to another device.</p>' +
    '</div>';

  html += '<div class="actions" style="margin-top:24px;"><button class="btn" id="playAgainBtn">Play Again</button></div>';

  app.innerHTML = html;
  renderMap(state, localMode ? null : myId);
  document.getElementById('exportHistoryBtn').addEventListener('click', exportHistory);
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    history.replaceState(null, '', location.pathname);
    myPlayerId = null;
    myRoomId = null;
    lastState = null;
    landingMode = null;
    localMode = false;
    localPassGate = false;
    localLastRound = null;
    view = 'landing';
    render();
  });
  updateHistoryUI(state, localMode ? null : myId);
}

function endCard(name, player, rounds) {
  const avg = rounds ? Math.round(player.totalScore / rounds) : 0;
  const maxPossible = rounds * 100;
  return '<div class="end-player-card"><h3 style="margin:0 0 10px 0;">' + name + '</h3>' +
    '<div class="big-score">' + player.totalScore + ' <span style="font-size:1rem; color:var(--muted); font-weight:600;">/ ' + maxPossible + '</span></div>' +
    '<div class="stat-label">total points over ' + rounds + ' rounds (avg ' + avg + ')</div></div>';
}

// Linear lon/lat -> SVG pixel projection, calibrated against WORLD_MAP_VB below.
function projectLonLat(lon, lat) {
  return [2.2691 * lon + 407.4573, -3.0384 * lat + 533.0976];
}

function renderMap(state, myId) {
  const dots = [];
  // Two players can guess the same country in the same round, which would
  // land their dots exactly on top of each other — nudge each player's dot
  // a fixed, small distance apart so both stay visible and clickable.
  const jitter = { p1: -2.2, p2: 2.2 };
  state.history.forEach((h, i) => {
    const coords = CENTROIDS[h.name];
    if (!coords) return;
    const p = projectLonLat(coords[0], coords[1]);
    const x = p[0] + (jitter[h.playerId] || 0);
    const y = p[1];
    dots.push(
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.2" fill="#5eead4" fill-opacity="0.9" stroke="#0b1a2e" stroke-width="0.8" ' +
      'data-country="' + h.name.replace(/"/g, '&quot;') + '" data-actual="' + h.actual + '" style="cursor:pointer;">' +
      '<title>' + h.name + ' — actual population: ' + fmt(h.actual) + '</title></circle>'
    );
  });
  document.getElementById('mapContainer').innerHTML =
    '<svg viewBox="' + WORLD_MAP_VB + '" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="30.767" y="241.591" width="784.077" height="458.627" fill="#0b1a2e"/>' +
    '<g fill="#16233d" stroke="#0d1830" stroke-width="0.6">' + WORLD_MAP_PATHS + '</g>' +
    dots.join('') + '</svg>';

  const infoEl = document.getElementById('mapInfo');
  document.querySelectorAll('#mapContainer circle').forEach(c => {
    c.addEventListener('click', () => {
      if (infoEl) infoEl.textContent = c.dataset.country + ' — actual population: ' + fmt(Number(c.dataset.actual));
    });
  });
}

// ---------------- Boot ----------------
if (roomFromUrl) {
  view = 'join';
} else {
  view = 'landing';
}
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>City Guesser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --accent-3: #f59e0b;
    --danger: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --p1: #ef4444;
    --p2: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }

  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1000;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: 320px;
  }
  #hud .row { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  #hud .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  #hud .value { font-size: 20px; font-weight: 700; }
  #hud .value .p1 { color: var(--p1); }
  #hud .value .p2 { color: var(--p2); }

  #prompt {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: 70vw;
  }
  #prompt .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  #prompt .sub #onlineTimer { color: var(--accent); font-weight: 700; }

  .player-switch {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: none;
    gap: 10px;
  }
  .player-btn {
    background: #1e293b;
    border: 2px solid #334155;
    color: var(--text);
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.55;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .player-btn.active { opacity: 1; }

  #guessBtn {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: var(--accent);
    color: #06202f;
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  #guessBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  #guessBtn:not(:disabled):hover { transform: translateX(-50%) scale(1.04); }

  #resultPanel {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 18px 26px;
    width: min(460px, 90vw);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
  }
  #resultPanel.show { display: block; }
  #resultPanel h2 { margin: 0 0 4px; font-size: 17px; }
  #resultPanel .distance { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  #resultPanel .points { font-size: 22px; font-weight: 800; color: var(--accent-2); margin-bottom: 12px; line-height: 1.5; }
  #resultPanel .winner-note { font-size: 13px; color: var(--muted); }
  #resultPanel button {
    background: var(--accent);
    color: #06202f;
    border: none;
    border-radius: 999px;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 2000;
    background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-direction: column;
    text-align: center;
    padding: 50px 20px 40px;
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  .overlay-inner {
    width: min(640px, 92vw);
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.65), rgba(30, 41, 59, 0.35));
    border: 1px solid #334155;
    border-radius: 22px;
    padding: 38px 34px 30px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  }
  #overlay h1 { font-size: 42px; margin: 0 0 6px; letter-spacing: -0.02em; }
  #overlay h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay p { color: var(--muted); max-width: 480px; margin: 0 auto 20px; line-height: 1.5; }
  #overlay button {
    background: var(--accent);
    color: #06202f;
    border: none;
    border-radius: 999px;
    padding: 16px 44px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(56, 189, 248, 0.4);
  }
  #overlay .ghost-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid #334155;
    box-shadow: none;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
  }

  .section-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    text-align: left;
    margin: 0 0 8px 2px;
  }
  .mode-toggle { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .mode-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .mode-btn:hover { transform: translateY(-1px); }
  .mode-btn.active {
    background: var(--accent);
    color: #06202f;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35);
    font-weight: 800;
  }
  /* Mode row (1 Player / 2 Players local / 2 Players online) — always one
     row, cyan theme. Difficulty row — its own row underneath, amber theme,
     so the two groups read as visually distinct choices. */
  .mode-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    justify-content: center;
    gap: 8px;
  }
  .mode-row .mode-btn { padding: 10px 16px; font-size: 13px; white-space: nowrap; }
  .difficulty-row { margin-bottom: 26px; }
  .diff-btn.active {
    background: var(--accent-3);
    border-color: var(--accent-3);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.35);
  }

  #nameInputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  #nameInputs input {
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 14px;
    width: 160px;
    text-align: center;
  }

  .history-teaser { color: var(--muted); font-size: 13px; margin-top: 22px; }

  .winner-line { font-size: 18px; color: var(--accent-2); font-weight: 700; margin: -6px auto 14px; }
  .score-summary { display: flex; gap: 26px; justify-content: center; margin-bottom: 6px; font-size: 15px; }
  .score-summary strong { font-size: 22px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .percentile { color: var(--muted); font-size: 13px; margin: 10px auto 4px; line-height: 1.6; }

  #reviewMap {
    height: 260px;
    width: 100%;
    max-width: 600px;
    border-radius: 10px;
    margin: 16px auto;
    border: 1px solid #334155;
  }

  .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 26px 0 8px; text-align: left; }

  .summary-table { border-collapse: collapse; margin: 0 auto 8px; font-size: 13px; width: 100%; }
  .summary-table th, .summary-table td { padding: 7px 12px; border-bottom: 1px solid #334155; text-align: left; }
  .summary-table th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .summary-table tr.current-play { background: rgba(56, 189, 248, 0.12); }

  .end-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

  .room-code {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin: 6px 0 18px;
    font-family: 'SFMono-Regular', Consolas, monospace;
  }
  .status-note { color: var(--muted); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .status-note.error-text { color: var(--danger); }
  #onlinePanel #nameInputs { margin-bottom: 14px; }

  .leaflet-popup-content-wrapper { background: #1e293b; color: var(--text); }
  .leaflet-popup-tip { background: #1e293b; }

  .country-label { pointer-events: none; }
  .country-label span {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    color: #f8fafc;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
    text-shadow: -1px -1px 0 #0f172a, 1px -1px 0 #0f172a, -1px 1px 0 #0f172a, 1px 1px 0 #0f172a, 0 0 5px #0f172a;
  }

</style>
</head>
<body>

<div id="map"></div>

<div id="prompt">
  <div id="promptCity">Loading...</div>
  <div class="sub" id="promptSub">Click anywhere on the map to drop your pin</div>
</div>

<div id="hud">
  <div class="row">
    <div>
      <div class="label">Round</div>
      <div class="value" id="roundValue">1 / 5</div>
    </div>
    <div>
      <div class="label">Score</div>
      <div class="value" id="scoreValue">0</div>
    </div>
  </div>
</div>

<div id="playerSwitch" class="player-switch"></div>

<button id="guessBtn" disabled>Place a pin to guess</button>

<div id="resultPanel">
  <h2 id="resultCity"></h2>
  <div class="distance" id="resultDistance"></div>
  <div class="points" id="resultPoints"></div>
  <div class="winner-note" id="autoAdvanceNote" style="display:none;">Next round starts automatically…</div>
  <button id="nextBtn">Next City →</button>
</div>

<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  const ROUNDS = 5;
  const MAX_POINTS = 5000;
  const EARTH_RADIUS_KM = 6371;
  const PLAYER_COLORS = { p1: '#ef4444', p2: '#3b82f6' };
  const ACTUAL_COLOR = '#22c55e';
  // World_Physical_Map has genuinely vivid natural coloring (green lowlands,
  // brown highlands, blue oceans) baked into the tiles themselves — a CSS
  // filter can't manufacture that on a paler source, it just blows out
  // highlights (tried World_Terrain_Base + saturate/contrast: land clipped
  // to solid white, ocean went neon cyan). But its native tiles stop at
  // zoom 8, and just letting Leaflet upscale those tiles past that (the
  // previous approach) is genuinely blurry/pixelated at high zoom — not a
  // real fix. So: use World_Physical_Map for the vivid low/overview zooms
  // (2-8), then switch to World_Terrain_Base — a real, higher-resolution
  // Esri layer with native tiles up to zoom 13 — for zoom 9 and beyond, so
  // "zoomed in" actually means real detail instead of a blown-up blur. The
  // color is more muted at that point (terrain shading rather than the
  // vivid physical palette), which is a fair tradeoff for genuine sharpness.
  const TILE_LOW_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}';
  const TILE_HIGH_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}';
  const TILE_ATTRIBUTION = 'Tiles &copy; Esri &mdash; Source: US National Park Service';
  const TILE_LOW_MAX_NATIVE_ZOOM = 8;
  const TILE_SWITCH_ZOOM = 9; // zoom level at which the high-res layer takes over
  const TILE_HIGH_MAX_NATIVE_ZOOM = 13;
  const TILE_MAX_ZOOM = 13;
  // Country borders as clean vector lines (no raster labels, no ugly
  // baked-in font) drawn on top of the base map — off by default (Hard
  // mode) so the base map stays unlabeled while guessing, shown at reveal
  // after every guess, and shown throughout in Easy mode. Natural Earth
  // 110m country outlines, ~250KB, fetched once and cached in memory.
  const BORDERS_GEOJSON_URL = 'https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json';
  // State/province (admin-1) boundaries, shown at reveal alongside the
  // country borders. Fetched live, scoped to just the reveal's bounding
  // box, from Esri's public "World Administrative Divisions" layer — a
  // queryable vector FeatureServer, not a static file. Several static
  // "world admin-1 geojson" files circulating online turned out, on
  // inspection, to only actually cover a handful of large countries
  // (US/Canada/Australia/Brazil/China/India) despite being labeled as
  // global; this Esri layer was checked directly (Poland, Kenya, Brazil,
  // Uganda, Lithuania all returned real subdivisions) and covers the whole
  // world, so it's the reliable choice even though it needs a network call
  // per reveal rather than one file loaded once.
  const STATE_BOUNDARY_URL = 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Administrative_Divisions/FeatureServer/0/query';
  const STORAGE_KEY = 'cityGuesserHistory_v1';
  const FN_ROOM = '/.netlify/functions/city-room';
  const FN_LEADERBOARD = '/.netlify/functions/city-leaderboard';

  // ---------------------------------------------------------------------
  // Geo math
  // ---------------------------------------------------------------------
  function toRad(deg) { return (deg * Math.PI) / 180; }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return EARTH_RADIUS_KM * c;
  }

  function scoreForDistance(km) {
    const points = MAX_POINTS * Math.exp(-km / 2000);
    return Math.max(0, Math.round(points));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeDotIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.5);"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
    });
  }
  const actualIcon = makeDotIcon(ACTUAL_COLOR);

  // ---------------------------------------------------------------------
  // History / leaderboard persistence.
  //
  // Primary source of truth is the global, cross-device leaderboard served
  // by netlify/functions/city-leaderboard.js. If that's unreachable — most
  // notably when this exact file is opened directly from disk rather than
  // served by Netlify — everything falls back to localStorage so the game
  // still works fully offline, just scoped to this browser.
  // ---------------------------------------------------------------------
  function loadHistoryLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveHistoryLocal(arr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) { /* storage unavailable */ }
  }
  function recordPlayLocal(play) {
    const h = loadHistoryLocal();
    h.push(play);
    saveHistoryLocal(h);
  }
  async function fetchLeaderboardEntries(limit) {
    try {
      const res = await fetch(`${FN_LEADERBOARD}?limit=${limit || 100}`);
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      return Array.isArray(data.plays) ? data.plays : [];
    } catch (e) {
      return loadHistoryLocal();
    }
  }
  async function postPlay(play) {
    try {
      const res = await fetch(FN_LEADERBOARD, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ play }),
      });
      if (!res.ok) throw new Error('bad status');
      return true;
    } catch (e) {
      recordPlayLocal(play);
      return false;
    }
  }
  function scorePoolFrom(entries) {
    const pool = [];
    entries.forEach((p) => {
      if (typeof p.totals.p1 === 'number') pool.push(p.totals.p1);
      if (p.mode !== '1p' && typeof p.totals.p2 === 'number') pool.push(p.totals.p2);
    });
    return pool;
  }
  // A play's representative score for ranking — the winning score in a
  // 2-player game, the only score in a 1-player game.
  function playScore(p) {
    return p.mode !== '1p' ? Math.max(p.totals.p1 ?? 0, p.totals.p2 ?? 0) : (p.totals.p1 ?? 0);
  }
  function topPlaysByScore(entries, limit) {
    return entries.slice().sort((a, b) => playScore(b) - playScore(a)).slice(0, limit || 10);
  }
  function getPercentile(score, pool) {
    if (!pool.length) return null;
    let less = 0, equal = 0;
    pool.forEach((s) => { if (s < score) less++; else if (s === score) equal++; });
    return Math.round(((less + 0.5 * equal) / pool.length) * 100);
  }

  // ---------------------------------------------------------------------
  // Map setup
  // ---------------------------------------------------------------------
  const map = L.map('map', {
    worldCopyJump: true,
    minZoom: 2,
    maxZoom: TILE_MAX_ZOOM,
  }).setView([20, 0], 2);

  // Physical basemap only: terrain, elevation, rivers, coastlines. No city
  // labels, place names, or political borders by default. Two stacked tile
  // layers, each only active in its own zoom range, so overview zooms get
  // World_Physical_Map's vivid natural color and zoomed-in views get real
  // World_Terrain_Base detail (native up to 13) instead of a blurry upscale.
  L.tileLayer(TILE_LOW_URL, {
    attribution: TILE_ATTRIBUTION, minZoom: 2, maxZoom: TILE_SWITCH_ZOOM - 1, maxNativeZoom: TILE_LOW_MAX_NATIVE_ZOOM,
  }).addTo(map);
  L.tileLayer(TILE_HIGH_URL, {
    attribution: TILE_ATTRIBUTION, minZoom: TILE_SWITCH_ZOOM, maxZoom: TILE_MAX_ZOOM, maxNativeZoom: TILE_HIGH_MAX_NATIVE_ZOOM,
  }).addTo(map);

  // Borders overlay — clean vector lines (a "halo": a soft dark line under
  // a thin bright line, so it reads on both light and dark terrain), not a
  // raster reference layer, so there's no baked-in label font and no
  // blurring at high zoom. Loaded once on first use and cached; added or
  // removed from the map depending on difficulty and game phase (see
  // showBorders/hideBorders).
  let bordersGeoJson = null;
  let borderLayerGroup = null;
  let bordersShown = false;
  // Country name labels — one small div-icon marker per country, placed at
  // that country's bounding-box center. Built once (lazily, from the same
  // borders GeoJSON already being fetched) and cached like the border lines
  // themselves. Only actually shown above a zoom threshold — at the
  // whole-world overview (Easy mode's default view) ~180 labels at once
  // would just be unreadable clutter, so they fade in once zoomed in
  // enough to read them, which is exactly when a reveal has zoomed into
  // the relevant area anyway.
  let countryLabelLayer = null;
  let countryLabelsWanted = false;
  const COUNTRY_LABEL_MIN_ZOOM = 4;

  function buildCountryLabels(data) {
    if (countryLabelLayer) return countryLabelLayer;
    const markers = [];
    data.features.forEach((f) => {
      const name = f.properties && (f.properties.name || f.properties.NAME || f.properties.ADMIN);
      if (!name) return;
      let center;
      try { center = L.geoJSON(f).getBounds().getCenter(); } catch (e) { return; }
      markers.push(L.marker(center, {
        icon: L.divIcon({ className: 'country-label', html: `<span>${name}</span>`, iconSize: [0, 0] }),
        interactive: false, keyboard: false,
      }));
    });
    countryLabelLayer = L.layerGroup(markers);
    return countryLabelLayer;
  }
  function updateCountryLabelVisibility() {
    if (!countryLabelLayer) return;
    const shouldShow = countryLabelsWanted && map.getZoom() >= COUNTRY_LABEL_MIN_ZOOM;
    const isShown = map.hasLayer(countryLabelLayer);
    if (shouldShow && !isShown) countryLabelLayer.addTo(map);
    if (!shouldShow && isShown) map.removeLayer(countryLabelLayer);
  }
  map.on('zoomend', updateCountryLabelVisibility);

  function loadBordersGeoJson() {
    if (bordersGeoJson) return Promise.resolve(bordersGeoJson);
    return fetch(BORDERS_GEOJSON_URL)
      .then((res) => res.json())
      .then((data) => { bordersGeoJson = data; return data; })
      .catch(() => null);
  }
  function showBorders() {
    countryLabelsWanted = true;
    if (bordersShown) { updateCountryLabelVisibility(); return; }
    bordersShown = true;
    loadBordersGeoJson().then((data) => {
      if (!data || !bordersShown) return; // hidden again before this finished loading
      if (!borderLayerGroup) {
        const halo = L.geoJSON(data, { style: { color: '#0f172a', weight: 3, opacity: 0.55, fillOpacity: 0 }, interactive: false });
        const line = L.geoJSON(data, { style: { color: '#f8fafc', weight: 1.2, opacity: 0.95, fillOpacity: 0 }, interactive: false });
        borderLayerGroup = L.layerGroup([halo, line]);
      }
      borderLayerGroup.addTo(map);
      buildCountryLabels(data);
      updateCountryLabelVisibility();
    });
  }
  function hideBorders() {
    bordersShown = false;
    countryLabelsWanted = false;
    if (borderLayerGroup && map.hasLayer(borderLayerGroup)) map.removeLayer(borderLayerGroup);
    updateCountryLabelVisibility();
  }

  // State/province boundaries and nearby reference-city markers, both shown
  // only after a guess is submitted (not while guessing — that would give
  // away the answer), scoped to the small area the reveal map zooms into.
  let stateBoundaryLayer = null;
  let stateBoundaryRequestId = 0;
  let referenceCityMarkers = [];

  function clearStateBoundaries() {
    stateBoundaryRequestId += 1; // invalidates any in-flight fetch from a previous round
    if (stateBoundaryLayer) { map.removeLayer(stateBoundaryLayer); stateBoundaryLayer = null; }
  }
  function showStateBoundaries(bounds) {
    clearStateBoundaries();
    const thisRequestId = stateBoundaryRequestId;
    const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    const latSpan = ne.lat - sw.lat, lngSpan = ne.lng - sw.lng;
    // A very wide-off guess zooms out to a huge bounding box — state lines
    // aren't legible at that scale anyway, and it'd mean a much heavier
    // query, so skip fetching them in that case.
    if (latSpan > 60 || lngSpan > 90) return;
    const geometry = encodeURIComponent(JSON.stringify({
      xmin: sw.lng, ymin: sw.lat, xmax: ne.lng, ymax: ne.lat, spatialReference: { wkid: 4326 },
    }));
    const url = `${STATE_BOUNDARY_URL}?geometry=${geometry}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=NAME,COUNTRY,ADMINTYPE&returnGeometry=true&f=geojson`;
    fetch(url)
      .then((res) => res.json())
      .then((data) => {
        // The reveal may have already moved on to the next round by the
        // time this resolves (clearStateBoundaries bumps the request id) —
        // don't draw a stale layer over a new round.
        if (thisRequestId !== stateBoundaryRequestId || !data || !data.features || !data.features.length) return;
        stateBoundaryLayer = L.geoJSON(data, {
          style: { color: '#f8fafc', weight: 1, opacity: 0.5, fillOpacity: 0, dashArray: '2,5' },
          interactive: false,
        }).addTo(map);
        stateBoundaryLayer.bringToBack();
      })
      .catch(() => {}); // best-effort — the reveal is still complete without this layer
  }

  function clearReferenceCityMarkers() {
    referenceCityMarkers.forEach((m) => map.removeLayer(m));
    referenceCityMarkers = [];
  }
  function showReferenceCityMarkers(bounds, skipName) {
    clearReferenceCityMarkers();
    const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    if ((ne.lat - sw.lat) > 60 || (ne.lng - sw.lng) > 90) return; // same reasoning as showStateBoundaries
    CITIES.forEach(([name, country, lat, lng]) => {
      if (name === skipName) return;
      if (!bounds.contains([lat, lng])) return;
      const marker = L.circleMarker([lat, lng], {
        radius: 4, color: '#e2e8f0', weight: 1, fillColor: '#64748b', fillOpacity: 0.9,
      }).bindTooltip(`${name}, ${country}`, { direction: 'top', offset: [0, -4] });
      marker.addTo(map);
      referenceCityMarkers.push(marker);
    });
  }

  // ---------------------------------------------------------------------
  // DOM references
  // ---------------------------------------------------------------------
  const promptCityEl = document.getElementById('promptCity');
  const promptSubEl = document.getElementById('promptSub');
  const roundValueEl = document.getElementById('roundValue');
  const scoreValueEl = document.getElementById('scoreValue');

  // True when this tab was opened via a shared invite link (?room=CODE) —

  function activePids() { return mode === '2p' ? ['p1', 'p2'] : ['p1']; }
  function currentCity() { return sequence[roundIndex]; }

  // Name inputs start empty (showing only the greyed-out placeholder) rather
  // than pre-filled with the literal text "Player 1"/"Player 2" — otherwise
  // typing a real name meant first deleting that placeholder text out of the
  // box. Once someone customizes a name, that custom value is what shows.
  function nameInputValue(pid) {
    const generic = pid === 'p1' ? 'Player 1' : 'Player 2';
    return playerNames[pid] === generic ? '' : playerNames[pid];
  }

  // Belt-and-suspenders on top of starting blank: select any existing text
  // the instant a name field is focused, so clicking in and typing always
  // replaces rather than requiring a manual delete first.
  function wireNameInputSelectOnFocus() {
    overlay.querySelectorAll('#nameInputs input').forEach((inp) => {
      inp.addEventListener('focus', () => inp.select());

  // ---------------------------------------------------------------------
  // Setup screen
  // ---------------------------------------------------------------------
  async function refreshHistoryTeaser() {
    const el = document.getElementById('historyTeaser');
    if (!el) return;
    const entries = await fetchLeaderboardEntries(500);
    const stillThere = document.getElementById('historyTeaser');
    if (!stillThere) return; // screen moved on while this was in flight
    if (entries.length === 0) {
      stillThere.textContent = 'No games played yet — this will be the first!';
      return;
    }
    const best = Math.max(...entries.map((p) => (p.mode !== '1p' ? Math.max(p.totals.p1, p.totals.p2 ?? 0) : p.totals.p1)));
    stillThere.textContent = `${entries.length} game${entries.length === 1 ? '' : 's'} played so far. Best score: ${best.toLocaleString()}.`;
  }

  function renderSetupScreen() {

    onlinePlayerId = null;

    let bodyHTML;
    if (mode === '2p-online') {
      bodyHTML = `
        <div id="onlinePanel">

              <input id="onlineNameInput" placeholder="Your name" value="${nameInputValue('p1')}" maxlength="20" />
            </div>
            <button id="onlineActionBtn" type="button">Create Game</button>
          ` : `
            <div id="nameInputs">
              <input id="onlineNameInput" placeholder="Your name" value="${nameInputValue('p2')}" maxlength="20" />
              <input id="onlineCodeInput" placeholder="Room code" value="${prefillRoomCode}" maxlength="6" style="text-transform:uppercase" />
            </div>
            <button id="onlineActionBtn" type="button">Join Game</button>
          `}
          <p class="status-note" id="onlineError"></p>
        </div>`;
    } else {
      bodyHTML = `
        <div id="nameInputs" style="${mode === '2p' ? '' : 'display:none'}">
          <input id="p1Name" placeholder="Player 1 name" value="${nameInputValue('p1')}" maxlength="20" />
          <input id="p2Name" placeholder="Player 2 name" value="${nameInputValue('p2')}" maxlength="20" />
        </div>
        <button id="startBtn">Start Game</button>`;
    }

    overlay.innerHTML = `
      <div class="overlay-inner">
        <h1>City <span>Guesser</span></h1>
        <p>You'll be given the name of a city. Click on the map to drop your pin as close as you can to it. Score up to 5,000 points per round based on how close your guess is. 5 rounds per game.</p>
        ${modeButtons}
        ${bodyHTML}
        <p class="history-teaser" id="historyTeaser">Checking game history…</p>
      </div>
    `;
    overlay.classList.remove('hidden');

    overlay.querySelectorAll('[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        captureNameInputs();
        mode = btn.dataset.mode;
        renderSetupScreen();
      });
    });
    overlay.querySelectorAll('[data-difficulty]').forEach((btn) => {
      btn.addEventListener('click', () => {
        captureNameInputs();
        difficulty = btn.dataset.difficulty;
        renderSetupScreen();
      });
    });

    if (mode === '2p-online') {
      overlay.querySelectorAll('[data-onlinetab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          captureNameInputs();
          onlineTab = btn.dataset.onlinetab;
          renderSetupScreen();
        });
      });
      document.getElementById('onlineActionBtn').addEventListener('click', handleOnlineAction);
    } else {
      document.getElementById('startBtn').addEventListener('click', () => {
        captureNameInputs();
        startGame();
      });
    }

    wireNameInputSelectOnFocus();
    refreshHistoryTeaser();
  }

  // Minimal screen shown when this tab was opened via a shared invite link
  // (?room=CODE) — just a name field and a Join button, skipping the full
  // mode/difficulty selection page since the game is already decided by the
  // link. A small link at the bottom is the only way back to the full menu.
  function renderJoinOnlyScreen() {
    overlay.innerHTML = `
      <div class="overlay-inner">
        <h1>City <span>Guesser</span></h1>
        <p>You've been invited to a game. Enter your name to join room <strong>${prefillRoomCode}</strong>.</p>
        <div id="nameInputs">
          <input id="onlineNameInput" placeholder="Your name" value="${nameInputValue('p2')}" maxlength="20" />
        </div>
        <button id="onlineActionBtn" type="button">Join Game</button>
        <p class="status-note" id="onlineError"></p>
        <p class="history-teaser"><a href="#" id="fullMenuLink" style="color:inherit;">Not joining a game? Open the main menu</a></p>
      </div>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('onlineActionBtn').addEventListener('click', handleOnlineAction);
    document.getElementById('fullMenuLink').addEventListener('click', (e) => {
      e.preventDefault();
      directJoinLink = false;
      renderSetupScreen();
    });
    wireNameInputSelectOnFocus();
  }

  function captureNameInputs() {
    const p1Input = document.getElementById('p1Name');
    const p2Input = document.getElementById('p2Name');
    if (p1Input && p1Input.value.trim()) playerNames.p1 = p1Input.value.trim();
    if (p2Input && p2Input.value.trim()) playerNames.p2 = p2Input.value.trim();
    const onlineNameInput = document.getElementById('onlineNameInput');
    if (onlineNameInput && onlineNameInput.value.trim()) {
      if (onlineTab === 'create') playerNames.p1 = onlineNameInput.value.trim();
      else playerNames.p2 = onlineNameInput.value.trim();
    }
  }

  // ---------------------------------------------------------------------
  // Local game flow (1 player, or 2 players sharing this screen)
  // ---------------------------------------------------------------------
  function startGame() {
    sequence = shuffle(CITIES).slice(0, ROUNDS);
    roundIndex = 0;
    totals = { p1: 0, p2: 0 };
    gameRounds = [];
    overlay.classList.add('hidden');
    startRound();
  }

  function startRound() {
    awaitingGuess = true;
    activePlayer = 'p1';
    guesses = { p1: null, p2: null };
    clearMarkers();
    map.setView([20, 0], 2);
    if (difficulty === 'easy') showBorders(); else hideBorders();

    const [name, country] = currentCity();
    promptCityEl.textContent = `Find: ${name}, ${country}`;
    promptSubEl.textContent = mode === '2p'
      ? "Pick a player below, then click the map to place their pin — the other player's pin stays hidden until you submit"
      : 'Click anywhere on the map to drop your pin';
    roundValueEl.textContent = `${roundIndex + 1} / ${ROUNDS}`;
    resultPanel.classList.remove('show');
    autoAdvanceNote.style.display = 'none';
    nextBtn.style.display = '';

    updateHud();
    renderPlayerSwitch();
    updateGuessButtonState();
  }

  function clearMarkers() {
    if (guessMarkers.p1) { map.removeLayer(guessMarkers.p1); }
    if (guessMarkers.p2) { map.removeLayer(guessMarkers.p2); }
    guessMarkers = { p1: null, p2: null };
    if (actualMarker) { map.removeLayer(actualMarker); actualMarker = null; }
    roundLines.forEach((l) => map.removeLayer(l));
    roundLines = [];
    clearStateBoundaries();
    clearReferenceCityMarkers();
  }

  // In same-screen 2-player mode, only the currently active player's pin
  // is visible on the map — switching players hides the other one's guess
  // so neither can see where the other clicked before submitting. Both
  // reappear together once the round is submitted (see revealAllGuessMarkers).
  function syncGuessMarkerVisibility() {
    ['p1', 'p2'].forEach((pid) => {
      const marker = guessMarkers[pid];
      if (!marker) return;
      const shouldShow = mode !== '2p' || pid === activePlayer;
      const isShown = map.hasLayer(marker);
      if (shouldShow && !isShown) marker.addTo(map);
      if (!shouldShow && isShown) map.removeLayer(marker);
    });
  }
  function revealAllGuessMarkers() {
    ['p1', 'p2'].forEach((pid) => {
      const marker = guessMarkers[pid];
      if (marker && !map.hasLayer(marker)) marker.addTo(map);
    });
  }

  function updateHud() {
    if (mode === '2p' || mode === '2p-online') {
      scoreValueEl.innerHTML = `<span class="p1">${playerNames.p1}: ${totals.p1.toLocaleString()}</span><br><span class="p2">${playerNames.p2}: ${totals.p2.toLocaleString()}</span>`;
    } else {
      scoreValueEl.textContent = totals.p1.toLocaleString();
    }
  }

  function renderPlayerSwitch() {
    if (mode !== '2p') {
      playerSwitchEl.style.display = 'none';
      playerSwitchEl.innerHTML = '';
      return;
    }
    playerSwitchEl.style.display = 'flex';
    playerSwitchEl.innerHTML = ['p1', 'p2'].map((pid) => `
      <button class="player-btn ${activePlayer === pid ? 'active' : ''}" data-player="${pid}" style="border-color:${PLAYER_COLORS[pid]}">
        <span style="color:${PLAYER_COLORS[pid]}">●</span> ${playerNames[pid]}${guesses[pid] ? ' ✓' : ''}
      </button>`).join('');
    playerSwitchEl.querySelectorAll('.player-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        activePlayer = btn.dataset.player;
        renderPlayerSwitch();
        syncGuessMarkerVisibility();
      });
    });
  }

  function updateGuessButtonState() {
    const pids = activePids();
    const ready = pids.every((pid) => guesses[pid]);
    guessBtn.disabled = !ready;
    if (ready) {
      guessBtn.textContent = mode === '2p' ? 'Submit Guesses' : 'Submit Guess';
    } else if (mode === '2p') {
      const placed = pids.filter((pid) => guesses[pid]).length;
      guessBtn.textContent = `Place both pins (${placed}/2)`;
    } else {
      guessBtn.textContent = 'Place a pin to guess';
    }
  }

  map.on('click', (e) => {
    if (mode === '2p-online') {
      if (!onlineRoomId || onlineAnswered) return;
      onlineGuessLatLng = e.latlng;
      if (guessMarkers[onlinePlayerId]) {
        guessMarkers[onlinePlayerId].setLatLng(e.latlng);
      } else {
        guessMarkers[onlinePlayerId] = L.marker(e.latlng, { icon: makeDotIcon(PLAYER_COLORS[onlinePlayerId]) }).addTo(map);
      }
      guessBtn.disabled = false;
      guessBtn.textContent = 'Submit Guess';
      return;
    }
    if (!awaitingGuess) return;
    const pid = mode === '2p' ? activePlayer : 'p1';
    guesses[pid] = e.latlng;
    if (guessMarkers[pid]) {
      guessMarkers[pid].setLatLng(e.latlng);
    } else {
      guessMarkers[pid] = L.marker(e.latlng, { icon: makeDotIcon(PLAYER_COLORS[pid]) }).addTo(map);
    }
    syncGuessMarkerVisibility();
    updateGuessButtonState();
    renderPlayerSwitch();
  });

  guessBtn.addEventListener('click', () => {
    if (guessBtn.disabled) return;
    if (mode === '2p-online') { submitOnlineGuess(); return; }
    if (!awaitingGuess) return;
    submitGuess();
  });

  function submitGuess() {
    awaitingGuess = false;
    revealAllGuessMarkers(); // both pins become visible together at reveal
    const [name, country, lat, lng] = currentCity();
    const roundEntry = { name, country, lat, lng, guesses: {} };
    const boundsPoints = [[lat, lng]];

    activePids().forEach((pid) => {
      const gl = guesses[pid];
      const guessLng = ((gl.lng + 180) % 360 + 360) % 360 - 180; // normalize dateline wraparound
      const guessLat = Math.max(-90, Math.min(90, gl.lat));
      const distanceKm = haversineKm(guessLat, guessLng, lat, lng);
      const points = scoreForDistance(distanceKm);
      totals[pid] += points;
      roundEntry.guesses[pid] = { lat: guessLat, lng: guessLng, distanceKm, points };

      const line = L.polyline([[guessLat, guessLng], [lat, lng]], {
        color: PLAYER_COLORS[pid], weight: 2, dashArray: '6,6',
      }).addTo(map);
      roundLines.push(line);
      boundsPoints.push([guessLat, guessLng]);
    });

    actualMarker = L.marker([lat, lng], { icon: actualIcon }).addTo(map);
    gameRounds.push(roundEntry);
    map.fitBounds(L.latLngBounds(boundsPoints), { padding: [80, 80], maxZoom: 6 });
    showBorders(); // always reveal borders once the answer is shown, regardless of difficulty
    showStateBoundaries(map.getBounds());
    showReferenceCityMarkers(map.getBounds(), name);

    renderResultPanel(roundEntry);
    updateHud();
    guessBtn.disabled = true;
  }

  function renderResultPanel(roundEntry) {
    autoAdvanceNote.style.display = 'none';
    nextBtn.style.display = '';
    nextBtn.disabled = false;
    nextBtn.textContent = 'Next City →';
    resultCity.textContent = `${roundEntry.name}, ${roundEntry.country}`;
    if (mode === '1p') {
      const g = roundEntry.guesses.p1;
      resultDistance.textContent = `Your pin was ${g.distanceKm.toFixed(1)} km away`;
      resultPoints.textContent = `+${g.points.toLocaleString()} points`;
    } else {
      const g1 = roundEntry.guesses.p1, g2 = roundEntry.guesses.p2;
      resultDistance.innerHTML = `<span style="color:${PLAYER_COLORS.p1}">${playerNames.p1}</span>: ${g1.distanceKm.toFixed(1)} km &nbsp;·&nbsp; <span style="color:${PLAYER_COLORS.p2}">${playerNames.p2}</span>: ${g2.distanceKm.toFixed(1)} km`;
      const winner = g1.points === g2.points ? 'Tie this round' : `${g1.points > g2.points ? playerNames.p1 : playerNames.p2} wins this round`;
      resultPoints.innerHTML = `<span style="color:${PLAYER_COLORS.p1}">+${g1.points.toLocaleString()}</span> &nbsp;·&nbsp; <span style="color:${PLAYER_COLORS.p2}">+${g2.points.toLocaleString()}</span><br><span class="winner-note">${winner}</span>`;
    }
    resultPanel.classList.add('show');
  }

  nextBtn.addEventListener('click', () => {
    if (mode === '2p-online') { advanceOnlineRound(); return; }
    roundIndex += 1;
    if (roundIndex >= ROUNDS) {
      finishGame();
    } else {
      startRound();
    }
  });

  // Online rounds used to auto-advance a fixed number of seconds after the
  // reveal. Now both players explicitly click "Next Round" — this signals
  // readiness to the server; once both players have signalled (or a long
  // safety timeout elapses so an abandoned room doesn't hang forever), the
  // server moves everyone to the next round together.
  async function advanceOnlineRound() {
    if (onlineReadyClicked) return;
    onlineReadyClicked = true;
    nextBtn.disabled = true;
    nextBtn.textContent = 'Waiting for opponent…';
    try {
      const res = await fetch(FN_ROOM, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'ready', roomId: onlineRoomId, playerId: onlinePlayerId }),
      });
      const data = await res.json();
      if (res.ok) handleOnlineState(data.state);
    } catch (e) {
      // the next poll tick will reconcile state regardless
    }
  }

  // ---------------------------------------------------------------------
  // End of local game: record to the (global, with local fallback)
  // leaderboard, show summary + review map + leaderboard + percentile
  // ---------------------------------------------------------------------
  function buildPlayRecord() {
    let winner = null;
    if (mode === '2p') {
      winner = totals.p1 > totals.p2 ? 'p1' : totals.p2 > totals.p1 ? 'p2' : 'tie';
    }
    return {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      timestamp: new Date().toISOString(),
      mode,
      players: mode === '2p'
        ? [{ id: 'p1', name: playerNames.p1 }, { id: 'p2', name: playerNames.p2 }]
        : [{ id: 'p1', name: playerNames.p1 }],
      rounds: gameRounds,
      totals: mode === '2p' ? { p1: totals.p1, p2: totals.p2 } : { p1: totals.p1, p2: null },
      winner,
    };
  }

  async function finishGame() {
    resultPanel.classList.remove('show');
    const play = buildPlayRecord();
    const priorEntries = await fetchLeaderboardEntries(500); // snapshot BEFORE this game is added
    const poolBefore = scorePoolFrom(priorEntries);
    const posted = await postPlay(play);
    const allEntries = posted ? priorEntries.concat([play]) : loadHistoryLocal();
    renderEndScreen(play, poolBefore, topPlaysByScore(allEntries, 10));
  }

  function percentileLine(label, score, pool) {
    const pct = getPercentile(score, pool);
    if (pct === null) return `${label ? label + ': ' : ''}first game recorded.`;
    return `${label ? label + ': ' : ''}better than <strong>${pct}%</strong> of ${pool.length} previous game${pool.length === 1 ? '' : 's'}.`;
  }

  function renderEndScreen(play, poolBefore, topPlays, isCurrentFn) {
    const twoPlayer = play.mode !== '1p';
    const isCurrent = isCurrentFn || ((p) => p.id === play.id);

    const headerHTML = twoPlayer
      ? `<h1>Game <span>Over</span></h1><p class="winner-line">${play.winner === 'tie' ? 'Tie game!' : `${play.players.find((p) => p.id === play.winner).name} wins!`}</p>`
      : `<h1>Game <span>Over</span></h1>`;

    const scoresHTML = twoPlayer
      ? `<div class="score-summary">
           <div><span class="dot" style="background:${PLAYER_COLORS.p1}"></span>${play.players[0].name}: <strong>${play.totals.p1.toLocaleString()}</strong></div>
           <div><span class="dot" style="background:${PLAYER_COLORS.p2}"></span>${play.players[1].name}: <strong>${play.totals.p2.toLocaleString()}</strong></div>
         </div>`
      : `<div class="score-summary"><div><strong style="font-size:26px;color:var(--accent-2)">${play.totals.p1.toLocaleString()}</strong> / ${(MAX_POINTS * ROUNDS).toLocaleString()}</div></div>`;

    const percentileHTML = twoPlayer
      ? `<p class="percentile">${percentileLine(play.players[0].name, play.totals.p1, poolBefore)}<br>${percentileLine(play.players[1].name, play.totals.p2, poolBefore)}</p>`
      : `<p class="percentile">${percentileLine('', play.totals.p1, poolBefore)}</p>`;

    const roundTableHeader = !twoPlayer
      ? `<tr><th>#</th><th>City</th><th>Distance</th><th>Points</th></tr>`
      : `<tr><th>#</th><th>City</th><th>${play.players[0].name}</th><th>${play.players[1].name}</th></tr>`;
    const roundRows = play.rounds.map((r, i) => {
      if (!twoPlayer) {
        return `<tr><td>${i + 1}</td><td>${r.name}, ${r.country}</td><td>${r.guesses.p1.distanceKm.toFixed(1)} km</td><td>${r.guesses.p1.points.toLocaleString()}</td></tr>`;
      }
      return `<tr><td>${i + 1}</td><td>${r.name}, ${r.country}</td><td>${r.guesses.p1.distanceKm.toFixed(1)} km / ${r.guesses.p1.points.toLocaleString()}</td><td>${r.guesses.p2.distanceKm.toFixed(1)} km / ${r.guesses.p2.points.toLocaleString()}</td></tr>`;
    }).join('');

    const leaderboardRows = topPlays.map((p, i) => {
      const date = new Date(p.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const modeLabel = p.mode === '1p' ? '1P' : p.mode === '2p-online' ? '2P online' : '2P';
      const scoreText = p.mode !== '1p'
        ? `<span style="color:${PLAYER_COLORS.p1}">${p.players[0].name} ${p.totals.p1.toLocaleString()}</span> vs <span style="color:${PLAYER_COLORS.p2}">${p.players[1] ? p.players[1].name : '?'} ${(p.totals.p2 ?? 0).toLocaleString()}</span>`
        : `${p.totals.p1.toLocaleString()}`;
      return `<tr class="${isCurrent(p) ? 'current-play' : ''}"><td>#${i + 1}</td><td>${date}</td><td>${modeLabel}</td><td>${scoreText}</td></tr>`;
    }).join('');

    overlay.innerHTML = `
      <div class="overlay-inner">
        ${headerHTML}
        ${scoresHTML}
        ${percentileHTML}
        <div id="reviewMap"></div>
        <div class="section-title">This game's rounds</div>
        <table class="summary-table">
          <thead>${roundTableHeader}</thead>
          <tbody>${roundRows}</tbody>
        </table>
        <div class="section-title">Leaderboard — best scores of all time</div>
        <table class="summary-table">
          <thead><tr><th>#</th><th>Date</th><th>Mode</th><th>Score</th></tr></thead>
          <tbody>${leaderboardRows}</tbody>
        </table>
        <div class="end-actions">
          <button id="startBtn">Play Again</button>
          <button id="clearHistoryBtn" class="ghost-btn">Clear local backup</button>
        </div>
      </div>
    `;
    overlay.classList.remove('hidden');

    requestAnimationFrame(() => renderReviewMap(play));

    document.getElementById('startBtn').addEventListener('click', renderSetupScreen);
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      if (confirm("This clears the offline copy of your history stored in this browser (used only as a fallback when the shared leaderboard can't be reached). It won't affect the shared leaderboard other devices see. Continue?")) {
        localStorage.removeItem(STORAGE_KEY);
        renderSetupScreen();
      }
    });
  }

  function renderReviewMap(play) {
    if (reviewMapInstance) { reviewMapInstance.remove(); reviewMapInstance = null; }
    reviewMapInstance = L.map('reviewMap', {
      zoomControl: false,
      attributionControl: false,
      minZoom: 1,
      maxZoom: TILE_MAX_ZOOM,
    }).setView([20, 0], 1);
    L.tileLayer(TILE_LOW_URL, { minZoom: 1, maxZoom: TILE_SWITCH_ZOOM - 1, maxNativeZoom: TILE_LOW_MAX_NATIVE_ZOOM }).addTo(reviewMapInstance);
    L.tileLayer(TILE_HIGH_URL, { minZoom: TILE_SWITCH_ZOOM, maxZoom: TILE_MAX_ZOOM, maxNativeZoom: TILE_HIGH_MAX_NATIVE_ZOOM }).addTo(reviewMapInstance);
    loadBordersGeoJson().then((data) => {
      if (!data || !reviewMapInstance) return;
      L.geoJSON(data, { style: { color: '#0f172a', weight: 3, opacity: 0.5, fillOpacity: 0 }, interactive: false }).addTo(reviewMapInstance);
      L.geoJSON(data, { style: { color: '#f8fafc', weight: 1, opacity: 0.9, fillOpacity: 0 }, interactive: false }).addTo(reviewMapInstance);
    });

    const bounds = [];
    play.rounds.forEach((r) => {
      L.marker([r.lat, r.lng], { icon: actualIcon }).addTo(reviewMapInstance)
        .bindPopup(`${r.name}, ${r.country} (actual)`);
      bounds.push([r.lat, r.lng]);
      Object.keys(r.guesses).forEach((pid) => {
        const g = r.guesses[pid];
        if (g.lat == null || g.lng == null) return;
        const player = play.players.find((p) => p.id === pid);
        L.circleMarker([g.lat, g.lng], {
          radius: 6, color: PLAYER_COLORS[pid], fillColor: PLAYER_COLORS[pid], fillOpacity: 0.9, weight: 2,
        }).addTo(reviewMapInstance).bindPopup(`${player ? player.name : pid}: ${g.distanceKm.toFixed(0)} km, +${g.points.toLocaleString()}`);
        L.polyline([[g.lat, g.lng], [r.lat, r.lng]], { color: PLAYER_COLORS[pid], weight: 1, opacity: 0.6 }).addTo(reviewMapInstance);
        bounds.push([g.lat, g.lng]);
      });
    });
    if (bounds.length) reviewMapInstance.fitBounds(L.latLngBounds(bounds), { padding: [24, 24] });
  }

  // ---------------------------------------------------------------------
  // Online 2-player mode (cross-device) — talks to
  // netlify/functions/city-room.js, which owns city selection, timing,
  // and scoring so neither client has to trust the other.
  // ---------------------------------------------------------------------
  async function handleOnlineAction() {
    const errorEl = document.getElementById('onlineError');
    errorEl.className = 'status-note';
    errorEl.textContent = '';
    const nameInput = document.getElementById('onlineNameInput');
    const name = (nameInput.value || '').trim() || (onlineTab === 'create' ? 'Player 1' : 'Player 2');
    const btn = document.getElementById('onlineActionBtn');
    btn.disabled = true;
    btn.textContent = onlineTab === 'create' ? 'Creating…' : 'Joining…';

    try {
      if (onlineTab === 'create') {
        playerNames.p1 = name;
        const res = await fetch(FN_ROOM, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'create', name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not create a game.');
        onlineRoomId = data.roomId;
        onlinePlayerId = data.playerId;
        directJoinLink = false;
        renderOnlineWaitingScreen();
        startOnlinePolling();
      } else {
        // The minimal invite-link join screen doesn't render a code field —
        // the code is already known from the ?room= link — so fall back to
        // that when #onlineCodeInput isn't on the page.
        const codeInput = document.getElementById('onlineCodeInput');
        const code = (codeInput ? codeInput.value : prefillRoomCode || '').trim().toUpperCase();
        if (!code) throw new Error('Enter the room code your friend shared.');
        playerNames.p2 = name;
        const res = await fetch(FN_ROOM, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'join', roomId: code, name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not join that game.');
        onlineRoomId = data.roomId;
        onlinePlayerId = data.playerId;
        onlineRoundResults = [];
        onlineRenderKey = null;
        directJoinLink = false; // the join-link has served its purpose — "Play Again" later should reach the full menu, not this stale room's join screen
        overlay.classList.add('hidden');
        startOnlinePolling();
      }
    } catch (e) {
      errorEl.className = 'status-note error-text';
      errorEl.textContent = e.message || "Online mode needs this to be the Netlify-hosted copy of the game, not a local file.";
      btn.disabled = false;
      btn.textContent = onlineTab === 'create' ? 'Create Game' : 'Join Game';
    }
  }

  function renderOnlineWaitingScreen() {
    const shareUrl = `${location.origin}${location.pathname}?room=${onlineRoomId}`;
    overlay.innerHTML = `
      <div class="overlay-inner">
        <h1>Waiting for <span>Player 2</span></h1>
        <div class="room-code">${onlineRoomId}</div>
        <p>Share this code, or send the link, with whoever you're playing — they can be on any device, anywhere.</p>
        <button id="copyLinkBtn" class="ghost-btn" type="button">Copy invite link</button>
        <p class="status-note">Waiting for them to join…</p>
        <div class="end-actions"><button id="cancelOnlineBtn" class="ghost-btn" type="button">Cancel</button></div>
      </div>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('copyLinkBtn').addEventListener('click', async () => {
      const copyBtn = document.getElementById('copyLinkBtn');
      try {
        await navigator.clipboard.writeText(shareUrl);
        copyBtn.textContent = 'Copied!';
      } catch (e) {
        window.prompt('Copy this link:', shareUrl);
      }
    });
    document.getElementById('cancelOnlineBtn').addEventListener('click', renderSetupScreen);
  }

  function startOnlinePolling() {
    stopOnlinePolling();
    onlinePollTimer = setInterval(pollOnlineState, 1600);
    onlineCountdownTimer = setInterval(() => {
      if (onlineRoundDeadline) updateOnlineTimer(onlineRoundDeadline);
    }, 500);
    pollOnlineState();
  }
  function stopOnlinePolling() {
    if (onlinePollTimer) { clearInterval(onlinePollTimer); onlinePollTimer = null; }
    if (onlineCountdownTimer) { clearInterval(onlineCountdownTimer); onlineCountdownTimer = null; }
    onlineRoundDeadline = null;
  }

  async function pollOnlineState() {
    if (!onlineRoomId) return;
    try {
      const res = await fetch(`${FN_ROOM}?action=state&roomId=${onlineRoomId}`);
      const data = await res.json();
      if (!res.ok) {
        stopOnlinePolling();
        const errorEl = document.getElementById('onlineError');
        if (errorEl) { errorEl.className = 'status-note error-text'; errorEl.textContent = data.error || 'This game is no longer available.'; }
        else { renderSetupScreen(); }
        return;
      }
      handleOnlineState(data.state);
    } catch (e) {
      // transient network hiccup — try again on the next tick
    }
  }

  function handleOnlineState(state) {
    if (state.players.p1) playerNames.p1 = state.players.p1.name;
    if (state.players.p2) playerNames.p2 = state.players.p2.name;
    totals.p1 = state.players.p1 ? state.players.p1.totalScore : 0;
    totals.p2 = state.players.p2 ? state.players.p2.totalScore : 0;

    if (state.status === 'waiting') return; // still on the "waiting for opponent" screen

    if (state.status === 'ended') {
      stopOnlinePolling();
      finishOnlineGame(state);
      return;
    }

    const key = `${state.round}:${state.status}`;
    if (state.status === 'in_progress') {
      onlineRoundDeadline = state.roundDeadline;
      if (key !== onlineRenderKey) { onlineRenderKey = key; startOnlineRoundUI(state); }
      updateOnlineTimer(state.roundDeadline);
      updateHud();
    } else if (state.status === 'revealing') {
      onlineRoundDeadline = null; // stop the countdown/auto-submit ticker mid-reveal
      if (key !== onlineRenderKey) {
        onlineRenderKey = key;
        onlineRoundResults.push(state.lastRoundResult);
        revealOnlineRound(state);
      }
      updateHud();
    }
  }

  function startOnlineRoundUI(state) {
    overlay.classList.add('hidden');
    clearMarkers();
    map.setView([20, 0], 2);
    if (difficulty === 'easy') showBorders(); else hideBorders();
    onlineAnswered = false;
    onlineGuessLatLng = null;
    onlineReadyClicked = false;
    resultPanel.classList.remove('show');
    playerSwitchEl.style.display = 'none';
    playerSwitchEl.innerHTML = '';

    promptCityEl.textContent = `Find: ${state.current.name}, ${state.current.country}`;
    promptSubEl.innerHTML = `Click the map to place your pin — <span id="onlineTimer"></span>`;
    roundValueEl.textContent = `${state.round} / ${state.maxRounds}`;
    guessBtn.disabled = true;
    guessBtn.textContent = 'Place a pin to guess';
    updateOnlineTimer(state.roundDeadline);
  }

  function updateOnlineTimer(deadline) {
    const el = document.getElementById('onlineTimer');
    if (el) {
      const remaining = Math.max(0, Math.round((deadline - Date.now()) / 1000));
      el.textContent = `${remaining}s left`;
    }
    // If a pin was placed but never explicitly submitted and the round is
    // about to end, auto-submit that pin rather than losing the click —
    // matches the local-mode expectation that a placed pin is your answer.
    if (!onlineAnswered && onlineGuessLatLng && Date.now() >= deadline - 300) {
      submitOnlineGuess();
    }
  }

  async function submitOnlineGuess() {
    if (!onlineGuessLatLng || onlineAnswered) return;
    onlineAnswered = true;
    guessBtn.disabled = true;
    guessBtn.textContent = 'Waiting for opponent…';
    try {
      const res = await fetch(FN_ROOM, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'guess', roomId: onlineRoomId, playerId: onlinePlayerId, lat: onlineGuessLatLng.lat, lng: onlineGuessLatLng.lng }),
      });
      const data = await res.json();
      if (res.ok) handleOnlineState(data.state);
    } catch (e) {
      // the next poll tick will reconcile state regardless
    }
  }

  function revealOnlineRound(state) {
    showBorders(); // always reveal borders once the answer is shown, regardless of difficulty
    const r = state.lastRoundResult;
    actualMarker = L.marker([r.lat, r.lng], { icon: actualIcon }).addTo(map);
    const boundsPoints = [[r.lat, r.lng]];

    Object.keys(r.guesses).forEach((pid) => {
      const g = r.guesses[pid];
      if (g.lat == null || g.lng == null) return; // timed out, no pin to show
      if (pid !== onlinePlayerId) {
        const marker = L.marker([g.lat, g.lng], { icon: makeDotIcon(PLAYER_COLORS[pid]) }).addTo(map);
        roundLines.push(marker);
      }
      const line = L.polyline([[g.lat, g.lng], [r.lat, r.lng]], { color: PLAYER_COLORS[pid], weight: 2, dashArray: '6,6' }).addTo(map);
      roundLines.push(line);
      boundsPoints.push([g.lat, g.lng]);
    });
    map.fitBounds(L.latLngBounds(boundsPoints), { padding: [80, 80], maxZoom: 6 });
    showStateBoundaries(map.getBounds());
    showReferenceCityMarkers(map.getBounds(), r.name);

    resultCity.textContent = `${r.name}, ${r.country}`;
    const g1 = r.guesses.p1, g2 = r.guesses.p2;
    const distText = (g) => (g.lat == null ? 'no guess' : `${g.distanceKm.toFixed(1)} km`);
    resultDistance.innerHTML = `<span style="color:${PLAYER_COLORS.p1}">${playerNames.p1}</span>: ${distText(g1)} &nbsp;·&nbsp; <span style="color:${PLAYER_COLORS.p2}">${playerNames.p2}</span>: ${distText(g2)}`;
    const winner = g1.points === g2.points ? 'Tie this round' : `${g1.points > g2.points ? playerNames.p1 : playerNames.p2} wins this round`;
    resultPoints.innerHTML = `<span style="color:${PLAYER_COLORS.p1}">+${g1.points.toLocaleString()}</span> &nbsp;·&nbsp; <span style="color:${PLAYER_COLORS.p2}">+${g2.points.toLocaleString()}</span><br><span class="winner-note">${winner}</span>`;
    autoAdvanceNote.style.display = 'none';
    nextBtn.style.display = '';
    nextBtn.disabled = false;
    nextBtn.textContent = 'Next Round →';
    resultPanel.classList.add('show');
    updateHud();
  }

  async function finishOnlineGame(state) {
    resultPanel.classList.remove('show');
    const p1 = state.players.p1, p2 = state.players.p2;
    const winner = p1.totalScore > p2.totalScore ? 'p1' : p2.totalScore > p1.totalScore ? 'p2' : 'tie';
    const roomIdForMatch = onlineRoomId;
    const play = {
      id: `${roomIdForMatch}-local`,
      timestamp: new Date().toISOString(),
      mode: '2p-online',
      players: [{ id: 'p1', name: p1.name }, { id: 'p2', name: p2.name }],
      rounds: onlineRoundResults.map((r) => ({ name: r.name, country: r.country, lat: r.lat, lng: r.lng, guesses: r.guesses })),
      totals: { p1: p1.totalScore, p2: p2.totalScore },
      winner,
    };
    playerNames.p1 = p1.name;
    playerNames.p2 = p2.name;

    const allEntries = await fetchLeaderboardEntries(500);
    const isThisGame = (p) => typeof p.id === 'string' && p.id.startsWith(`${roomIdForMatch}-`);
    const poolBefore = scorePoolFrom(allEntries.filter((p) => !isThisGame(p)));
    const topPlays = topPlaysByScore(allEntries, 10);

    renderEndScreen(play, poolBefore, topPlays, isThisGame);
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  const initialParams = new URLSearchParams(location.search);
  const roomParam = (initialParams.get('room') || '').toUpperCase().trim();
  if (roomParam) {
    mode = '2p-online';
    onlineTab = 'join';
    prefillRoomCode = roomParam;
    directJoinLink = true;
  }

  renderSetupScreen();
})();
</script>
</body>
</html>
